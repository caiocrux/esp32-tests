name: ESP32 Static Analysis

on:
  pull_request:
  push:
    branches:
      - main

jobs:

  static-analysis:

    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v5.3

    steps:

      - uses: actions/checkout@v4

      - name: Install analysis tools
        run: |
          apt-get update
          apt-get install -y \
              clang \
              clang-format \
              clang-tidy \
              cppcheck \
              python3-pip

          pip3 install cpplint

      #################################################
      # Formatting
      #################################################

      - name: Check formatting
        run: |
          find . \
            \( \
              -name "*.c" \
              -o -name "*.cpp" \
              -o -name "*.h" \
            \) \
            -print0 \
            | xargs -0 clang-format \
                --dry-run \
                --Werror

      #################################################
      # Configure
      #################################################

      - name: Set ESP32 target
        run: |
          idf.py set-target esp32

      #################################################
      # Build
      #################################################

      - name: Build project
        run: |
          idf.py build

      #################################################
      # cppcheck
      #################################################

      - name: cppcheck
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --inline-suppr \
            --force \
            --std=c11 \
            --error-exitcode=1 \
            .

      #################################################
      # clang tidy
      #################################################

      - name: clang-tidy
        run: |
          find . -name "*.c" | while read file
          do
              clang-tidy \
                  "$file" \
                  -- \
                  -Icomponents \
                  -Imain
          done

      #################################################
      # cpplint
      #################################################

      - name: cpplint
        run: |
          find . \
            -name "*.c" \
            -o -name "*.h" \
            | xargs cpplint

      #################################################
      # Tests
      #################################################

      - name: Run Unit Tests
        run: |
          echo "Add Unity tests here"

